<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>✨</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
    width: 100%;
    overflow: hidden;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background: #ffffff;
    font-family: system-ui, sans-serif;
    position: relative;
  }

  .stage {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
  }

  /* Soft colored halo (very subtle) */
  .halo {
    position: absolute;
    width: 220px;
    height: 220px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(120, 120, 200, 0.15) 0%, rgba(200, 120, 180, 0.08) 40%, transparent 70%);
    filter: blur(30px);
    animation: haloPulse 3.6s ease-in-out infinite;
    pointer-events: none;
  }

  @keyframes haloPulse {
    0%, 100% { transform: scale(1); opacity: 0.6; }
    50%      { transform: scale(1.35); opacity: 0.95; }
  }

  /* Pulsing rings */
  .ring {
    position: absolute;
    border-radius: 50%;
    border: 1.5px solid rgba(0, 0, 0, 0.07);
    width: 170px;
    height: 170px;
    animation: pulseRing 4.5s cubic-bezier(0.25, 0.46, 0.45, 0.94) infinite;
    pointer-events: none;
  }

  .ring:nth-child(2) { animation-delay: 1.5s; }
  .ring:nth-child(3) { animation-delay: 3s; }

  @keyframes pulseRing {
    0% {
      transform: scale(0.55);
      opacity: 0.75;
      border-width: 2px;
    }
    100% {
      transform: scale(3.2);
      opacity: 0;
      border-width: 0.3px;
    }
  }

  /* Ground shadow underneath image */
  .ground-shadow {
    position: absolute;
    bottom: calc(50% - 120px);
    width: 100px;
    height: 18px;
    border-radius: 50%;
    background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0.35) 0%, rgba(0, 0, 0, 0.15) 40%, transparent 75%);
    filter: blur(6px);
    animation: shadowPulse 3.8s cubic-bezier(0.65, 0, 0.35, 1) infinite;
    pointer-events: none;
    transform-origin: center;
  }

  @keyframes shadowPulse {
    0% {
      transform: scale(1);
      opacity: 0.9;
      filter: blur(6px);
    }
    45% {
      transform: scale(2.6);
      opacity: 0.45;
      filter: blur(14px);
    }
    55% {
      transform: scale(2.6);
      opacity: 0.45;
      filter: blur(14px);
    }
    100% {
      transform: scale(1);
      opacity: 0.9;
      filter: blur(6px);
    }
  }

  /* The image */
  .pic {
    position: relative;
    width: 120px;
    height: 120px;
    object-fit: cover;
    border-radius: 18px;
    display: block;
    user-select: none;
    -webkit-user-drag: none;
    animation: growAndShrink 3.8s cubic-bezier(0.65, 0, 0.35, 1) infinite;
    transform-origin: center;
    will-change: transform, box-shadow;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    box-shadow:
      0 10px 28px rgba(0, 0, 0, 0.14),
      0 3px 8px rgba(0, 0, 0, 0.08);
  }

  @keyframes growAndShrink {
    0% {
      transform: scale(1) rotate(0deg) translateY(0);
      box-shadow:
        0 10px 28px rgba(0, 0, 0, 0.14),
        0 3px 8px rgba(0, 0, 0, 0.08);
    }
    45% {
      transform: scale(4.4) rotate(-3deg) translateY(-8px);
      box-shadow:
        0 30px 70px rgba(0, 0, 0, 0.25),
        0 12px 28px rgba(0, 0, 0, 0.15);
    }
    55% {
      transform: scale(4.4) rotate(-3deg) translateY(-8px);
      box-shadow:
        0 30px 70px rgba(0, 0, 0, 0.25),
        0 12px 28px rgba(0, 0, 0, 0.15);
    }
    100% {
      transform: scale(1) rotate(0deg) translateY(0);
      box-shadow:
        0 10px 28px rgba(0, 0, 0, 0.14),
        0 3px 8px rgba(0, 0, 0, 0.08);
    }
  }

  /* Mobile tweak */
  @media (max-width: 600px) {
    .pic {
      width: 90px;
      height: 90px;
      border-radius: 14px;
    }
    @keyframes growAndShrink {
      0%   { transform: scale(1) rotate(0deg) translateY(0); }
      45%  { transform: scale(3.2) rotate(-3deg) translateY(-6px); }
      55%  { transform: scale(3.2) rotate(-3deg) translateY(-6px); }
      100% { transform: scale(1) rotate(0deg) translateY(0); }
    }
    .ground-shadow {
      width: 75px;
      height: 14px;
      bottom: calc(50% - 100px);
    }
    @keyframes shadowPulse {
      0%   { transform: scale(1); opacity: 0.9; filter: blur(5px); }
      45%  { transform: scale(2.4); opacity: 0.4; filter: blur(12px); }
      55%  { transform: scale(2.4); opacity: 0.4; filter: blur(12px); }
      100% { transform: scale(1); opacity: 0.9; filter: blur(5px); }
    }
    .halo { width: 160px; height: 160px; }
    .ring { width: 120px; height: 120px; }
  }

  /* Respect reduced motion */
  @media (prefers-reduced-motion: reduce) {
    .pic, .halo, .ring, .ground-shadow { animation: none; }
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="ring"></div>
    <div class="ring"></div>
    <div class="ring"></div>
    <div class="halo"></div>
    <img
      class="pic"
      src="https://i.ibb.co.com/MktK8djk/558d13a0171e0210d7918e004799b7bb.jpg"
      alt="pic"
      draggable="false"
    >
    <div class="ground-shadow"></div>
  </div>
</body>
</html>
